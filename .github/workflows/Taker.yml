name: Taker

on:
#  schedule:
#    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  Taker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compare all versions
      id: check_update
      run: |
        latest_myxmy=$(curl -s https://triple.winboooc.workers.dev/api/myxmy)
        latest_mycmy=$(curl -s https://triple.winboooc.workers.dev/api/mycmy)
        latest_myhmy=$(curl -s https://triple.winboooc.workers.dev/api/myhmy)
        latest_mysmy=$(curl -s https://triple.winboooc.workers.dev/api/mysmy)

        if [ -f README.md ]; then
          stored_myxmy=$(grep 'myxmy:' README.md | cut -d' ' -f2)
          stored_mycmy=$(grep 'mycmy:' README.md | cut -d' ' -f2)
          stored_myhmy=$(grep 'myhmy:' README.md | cut -d' ' -f2)
          stored_mysmy=$(grep 'mysmy:' README.md | cut -d' ' -f2)
        else
          stored_myxmy=""
          stored_mycmy=""
          stored_myhmy=""
          stored_mysmy=""
        fi

        echo "latest_myxmy=$latest_myxmy" >> $GITHUB_OUTPUT
        echo "latest_mycmy=$latest_mycmy" >> $GITHUB_OUTPUT
        echo "latest_myhmy=$latest_myhmy" >> $GITHUB_OUTPUT
        echo "latest_mysmy=$latest_mysmy" >> $GITHUB_OUTPUT

        echo "update_myxmy=$([ "$latest_myxmy" != "$stored_myxmy" ] && echo true || echo false)" >> $GITHUB_OUTPUT
        echo "update_mycmy=$([ "$latest_mycmy" != "$stored_mycmy" ] && echo true || echo false)" >> $GITHUB_OUTPUT
        echo "update_myhmy=$([ "$latest_myhmy" != "$stored_myhmy" ] && echo true || echo false)" >> $GITHUB_OUTPUT
        echo "update_mysmy=$([ "$latest_mysmy" != "$stored_mysmy" ] && echo true || echo false)" >> $GITHUB_OUTPUT

        if [ "$latest_myxmy" != "$stored_myxmy" ] || [ "$latest_mycmy" != "$stored_mycmy" ] || [ "$latest_myhmy" != "$stored_myhmy" ] || [ "$latest_mysmy" != "$stored_mysmy" ]; then
          echo "update_needed=true" >> $GITHUB_OUTPUT
        else
          echo "update_needed=false" >> $GITHUB_OUTPUT
        fi

    - name: Download and extract myxmy binaries (ZIP)
      if: steps.check_update.outputs.update_myxmy == 'true'
      run: |
        set -e
        for suffix in "" "6" "mac6"; do
          target="myxmy${suffix}"
          curl -L -o "${target}.zip" "https://triple.winboooc.workers.dev/bin/${target}"
          unzip -o "${target}.zip" -d "temp_${target}"
          exe=$(find "temp_${target}" -type f -exec file {} \; | grep -E 'ELF 64-bit|Mach-O 64-bit' | cut -d: -f1 | head -n 1)
          if [ -z "$exe" ]; then exit 1; fi
          mv "$exe" "$target"
          chmod +x "$target"
          rm -rf "temp_${target}" "${target}.zip"
        done

    - name: Download and extract mycmy binaries (Mixed)
      if: steps.check_update.outputs.update_mycmy == 'true'
      run: |
        set -e
        curl -L -o mycmy https://triple.winboooc.workers.dev/bin/mycmy
        curl -L -o mycmy6 https://triple.winboooc.workers.dev/bin/mycmy6
        curl -L -o mycmymac6.tgz https://triple.winboooc.workers.dev/bin/mycmymac6
        mkdir -p temp_mycmymac6
        tar -xzf mycmymac6.tgz -C temp_mycmymac6
        exe_mac=$(find temp_mycmymac6 -type f -exec file {} \; | grep 'Mach-O 64-bit' | cut -d: -f1 | head -n 1)
        [ -z "$exe_mac" ] && exe_mac=$(find temp_mycmymac6 -type f -executable | head -n 1)
        mv "$exe_mac" mycmymac6
        chmod +x mycmy mycmy6 mycmymac6
        rm -rf temp_mycmymac6 mycmymac6.tgz

    - name: Download myhmy binaries (Direct)
      if: steps.check_update.outputs.update_myhmy == 'true'
      run: |
        set -e
        curl -L -o myhmy https://triple.winboooc.workers.dev/bin/myhmy
        curl -L -o myhmy6 https://triple.winboooc.workers.dev/bin/myhmy6
        curl -L -o myhmymac6 https://triple.winboooc.workers.dev/bin/myhmymac6
        chmod +x myhmy myhmy6 myhmymac6

    - name: Download and extract mysmy binaries (TarGz)
      if: steps.check_update.outputs.update_mysmy == 'true'
      run: |
        set -e
        for suffix in "" "6" "mac6"; do
          target="mysmy${suffix}"
          curl -L -o "${target}.tar.gz" "https://triple.winboooc.workers.dev/bin/${target}"
          mkdir -p "temp_${target}"
          tar -xzf "${target}.tar.gz" -C "temp_${target}"
          exe=$(find "temp_${target}" -type f -name "sing-box" | head -n 1)
          if [ -z "$exe" ]; then exit 1; fi
          mv "$exe" "$target"
          chmod +x "$target"
          rm -rf "temp_${target}" "${target}.tar.gz"
        done

    - name: Install GitHub CLI
      if: steps.check_update.outputs.update_needed == 'true'
      run: sudo apt-get update && sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      if: steps.check_update.outputs.update_needed == 'true'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

    - name: Upload updated assets to release
      if: steps.check_update.outputs.update_needed == 'true'
      run: |
        set -e
        assets=""
        
        if [ "${{ steps.check_update.outputs.update_myxmy }}" == "true" ]; then
          [ -f myxmy ] && assets="$assets myxmy"
          [ -f myxmy6 ] && assets="$assets myxmy6"
          [ -f myxmymac6 ] && assets="$assets myxmymac6"
        fi

        if [ "${{ steps.check_update.outputs.update_mycmy }}" == "true" ]; then
          [ -f mycmy ] && assets="$assets mycmy"
          [ -f mycmy6 ] && assets="$assets mycmy6"
          [ -f mycmymac6 ] && assets="$assets mycmymac6"
        fi

        if [ "${{ steps.check_update.outputs.update_myhmy }}" == "true" ]; then
          [ -f myhmy ] && assets="$assets myhmy"
          [ -f myhmy6 ] && assets="$assets myhmy6"
          [ -f myhmymac6 ] && assets="$assets myhmymac6"
        fi

        if [ "${{ steps.check_update.outputs.update_mysmy }}" == "true" ]; then
          [ -f mysmy ] && assets="$assets mysmy"
          [ -f mysmy6 ] && assets="$assets mysmy6"
          [ -f mysmymac6 ] && assets="$assets mysmymac6"
        fi

        if [ -z "$assets" ]; then
          echo "No updated binaries to upload"
          exit 0
        fi

        if ! gh release view latest-auto &>/dev/null; then
          gh release create latest-auto --title "Latest triple" --notes "Taker"
        fi

        gh release upload latest-auto $assets --clobber

    - name: Commit and push README.md file
      if: steps.check_update.outputs.update_needed == 'true'
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f README.md ]; then git add README.md; fi
        git pull --rebase

        echo "myxmy: ${{ steps.check_update.outputs.latest_myxmy }}  " > README.md
        echo "mycmy: ${{ steps.check_update.outputs.latest_mycmy }}  " >> README.md
        echo "myhmy: ${{ steps.check_update.outputs.latest_myhmy }}  " >> README.md
        echo "mysmy: ${{ steps.check_update.outputs.latest_mysmy }}  " >> README.md

        git add README.md
        git commit -m "Update versions" || echo "No changes"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
